name: Vercel harden

# Disables Deployment Protection SSO when VERCEL_TOKEN is configured.
# Does not invent short *.vercel.app aliases that Vercel will not assign
# to team projects — see docs/VERCEL.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/vercel-harden.mjs"
      - ".github/workflows/vercel-harden.yml"
      - "docs/VERCEL.md"

jobs:
  harden:
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Disable SSO + print canonical URL
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_SLUG: gaia10
          VERCEL_PROJECT: artificial-banking-inc
        run: node scripts/vercel-harden.mjs
