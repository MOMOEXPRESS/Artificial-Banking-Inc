# Render blueprint for the ABI API (zero-spend notes below).
#
# Vercel hosts the console (free hobby). Prefer a free persistent host for the
# API when you can:
#   - Fly.io free allowance + volume (recommended free path)
#   - Oracle Cloud free tier VM + docker compose
#   - Campus/home VPS + docker compose
#
# Render: the `free` plan sleeps and cannot attach a disk — SQLite state is
# lost on every cold start. `starter` + disk persists SQLite but needs a card.
# This blueprint keeps `starter` as the documented Render path; for true
# zero-spend use docker-compose on Fly/Oracle (see docs/DEPLOY.md).
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Then set ABI_API_ORIGIN on Vercel to the URL this service gets.
#
services:
  - type: web
    name: abi-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    plan: starter
    disk:
      name: abi-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: POLICYVAULT_DB
        value: /data/policyvault.db
      - key: ABI_KEK
        sync: false
      - key: ABI_KEY_PEPPER
        sync: false
      - key: ABI_SIGNUP_TOKEN
        sync: false
      - key: ABI_CONSOLE_URL
        sync: false
      - key: ABI_CORS_ORIGINS
        sync: false
      - key: ABI_LOG_LEVEL
        value: info
      - key: RATE_LIMIT_PER_MIN
        value: "120"
      # Production signup email is optional; without it, invite-only / manual verify.
      - key: RESEND_API_KEY
        sync: false
      - key: ABI_NOTIFY_EMAIL_FROM
        sync: false
      - key: ABI_RUN_JOBS
        value: 1
      - key: CHAIN
        value: base-sepolia
      - key: CHAIN_RPC_URL
        sync: false
      - key: ABI_COMPLIANCE_FAIL_CLOSED
        value: "1"
      - key: ABI_ONCHAIN_ENABLED
        sync: false
      # Demo flags stay off. Disposable demos need ABI_ALLOW_UNSAFE_PROD=1 too.
      - key: POLICYVAULT_ALLOW_BOOTSTRAP
        value: "0"
      - key: POLICYVAULT_ALLOW_PUBLIC_ORG_CREATE
        value: "0"
      - key: POLICYVAULT_MOCK_TRANSFER
        value: "0"
      - key: ABI_ALLOW_LOCAL_TARGETS
        value: "0"
