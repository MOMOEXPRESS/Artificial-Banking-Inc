# Render blueprint for the ABI API.
#
# Vercel hosts the console. Render hosts the persistent API service.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Then set ABI_API_ORIGIN on Vercel to the URL this service gets.
#
services:
  - type: web
    name: abi-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    plan: starter
    disk:
      name: abi-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: POLICYVAULT_DB
        value: /data/policyvault.db
      - key: ABI_KEK
        sync: false
      - key: ABI_KEY_PEPPER
        sync: false
      - key: ABI_SIGNUP_TOKEN
        sync: false
      - key: ABI_CONSOLE_URL
        sync: false
      - key: ABI_CORS_ORIGINS
        sync: false
      # Production signup requires verification mail; configure a verified sender.
      - key: RESEND_API_KEY
        sync: false
      - key: ABI_NOTIFY_EMAIL_FROM
        sync: false
      - key: ABI_RUN_JOBS
        value: 1
      - key: CHAIN
        value: base-sepolia
      - key: CHAIN_RPC_URL
        sync: false
