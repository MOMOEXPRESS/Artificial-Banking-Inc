# Render blueprint for the ABI API (zero-spend notes below).
#
# Vercel hosts the console (free hobby). Prefer a free persistent host for the
# API when you can:
#   - Fly.io free allowance + volume (recommended free path)
#   - Oracle Cloud free tier VM + docker compose
#   - Campus/home VPS + docker compose
#
# Aligns with the free Render web service plan actually in use. Persistent
# disks require a paid plan — on free, SQLite lives on the ephemeral filesystem
# and is wiped on redeploy/restart. Prefer a free always-on host with a volume
# (Fly.io / Oracle free tier) when you need durable state; see docs/DEPLOY.md.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Then set ABI_API_ORIGIN on Vercel to the URL this service gets.
# Owner must set secrets in the Render dashboard (this file does not deploy them).
#
services:
  - type: web
    name: abi-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      # Ephemeral on free plan — data is lost on restart. Override if you attach a disk later.
      - key: POLICYVAULT_DB
        value: /tmp/policyvault.db
      - key: ABI_KEK
        sync: false
      - key: ABI_KEY_PEPPER
        sync: false
      - key: ABI_SIGNUP_TOKEN
        sync: false
      - key: ABI_CONSOLE_URL
        sync: false
      - key: ABI_CORS_ORIGINS
        sync: false
      - key: ABI_LOG_LEVEL
        value: info
      - key: RATE_LIMIT_PER_MIN
        value: "120"
      # Email is required for production signup (unless ABI_ALLOW_UNVERIFIED_SIGNUP=1 on testnet).
      # Primary (free): Brevo transactional API — verify one sender email, no domain needed.
      - key: BREVO_API_KEY
        sync: false
      - key: ABI_NOTIFY_EMAIL_FROM
        sync: false
      # Optional fallback only (Resend free without a domain only reaches the account owner).
      - key: RESEND_API_KEY
        sync: false
      # Optional Node SMTP path (e.g. smtp-relay.brevo.com:587) if not using BREVO_API_KEY.
      - key: SMTP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        sync: false
      # Testnet-only escape hatch; refused when CHAIN=base. Default unset/off.
      - key: ABI_ALLOW_UNVERIFIED_SIGNUP
        sync: false
      - key: ABI_RUN_JOBS
        value: 1
      - key: CHAIN
        value: base-sepolia
      - key: CHAIN_RPC_URL
        sync: false
      - key: ABI_COMPLIANCE_FAIL_CLOSED
        value: "1"
      - key: ABI_ONCHAIN_ENABLED
        sync: false
      # Demo flags stay off. Disposable demos need ABI_ALLOW_UNSAFE_PROD=1 too.
      - key: POLICYVAULT_ALLOW_BOOTSTRAP
        value: "0"
      - key: POLICYVAULT_ALLOW_PUBLIC_ORG_CREATE
        value: "0"
      - key: POLICYVAULT_MOCK_TRANSFER
        value: "0"
      - key: ABI_ALLOW_LOCAL_TARGETS
        value: "0"
