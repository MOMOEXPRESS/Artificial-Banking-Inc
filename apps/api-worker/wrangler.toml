# ABI API on Cloudflare Workers (Durable Object + SQLite) — the production API.
#
# Deploy from apps/api-worker only, always with this file:
#   npx wrangler deploy --config ./wrangler.toml --var ABI_GIT_COMMIT:$(git rev-parse HEAD)
# (a bare `wrangler deploy` at the repo root picks up ../../wrangler.jsonc instead).
# Rollback: npx wrangler rollback <version-id> --config ./wrangler.toml

name = "abi-api"
main = "src/worker.ts"
# Use a date supported by the installed workerd; nodejs_compat is explicit for clarity.
compatibility_date = "2025-10-11"
compatibility_flags = ["nodejs_compat"]

# Free-plan observability (Workers Logs).
[observability]
enabled = true

# Plain text vars — override per environment as needed.
# Production guard: demo bootstrap is refused in production (see apps/api/src/config.ts).
[vars]
CHAIN = "base-sepolia"
ABI_CONSOLE_URL = "https://artificial-banking-inc-web.vercel.app"
ABI_CORS_ORIGINS = "https://artificial-banking-inc-web.vercel.app"
ABI_NOTIFY_EMAIL_FROM = "ABI <onboarding@resend.dev>"
ABI_RUNTIME = "cloudflare-workers"
ABI_NO_LISTEN = "1"
ABI_RUN_JOBS = "0"
POLICYVAULT_ALLOW_BOOTSTRAP = "0"
POLICYVAULT_ALLOW_PUBLIC_ORG_CREATE = "0"

# Secrets (set via `npx wrangler secret put <NAME> --config ./wrangler.toml`):
#   RESEND_API_KEY         — email delivery (Resend HTTP API)
#   ABI_KEK
#   ABI_KEY_PEPPER
#   ABI_SIGNUP_TOKEN       — must equal ABI_SIGNUP_TOKEN on the Vercel console
#   CHAIN_RPC_URL          — only if it embeds a provider key
# Leave BREVO_API_KEY unset unless Brevo should take over (it is preferred when present).
# Do NOT put SMTP_* secrets here for the Worker path — SMTP/nodemailer is Node-only (#63).

[[durable_objects.bindings]]
name = "ABI"
class_name = "AbiApi"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AbiApi"]

# Alias native better-sqlite3 to the Durable Object SQL shim when bundling.
# iconv-lite's CJS streams helper breaks under esbuild → workerd; UTF-8 shim is enough.
[alias]
"better-sqlite3" = "./src/shims/better-sqlite3.ts"
"iconv-lite" = "./src/shims/iconv-lite.ts"
