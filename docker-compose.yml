# Artificial Banking Inc — local / VPS deploy stack.
#
# Three processes, one shared volume:
#   api     persistent HTTP service, owns the database
#   worker  background sweeps (escrow, approvals, subscriptions, reconcile)
#   web     console + marketing site, proxies /abi-api to the API
#
# The API and worker take the same database leases, so at most one of them ever
# runs a given job. ABI_RUN_JOBS=0 on the API makes that explicit rather than
# relying on the lease to arbitrate every tick.
#
# Persistence is SQLite on a volume: durable and transactional for a
# single-instance deployment. Postgres is the next step (roadmap P2-T2) and is
# about horizontal scale, not correctness. See
# docs/adr/2026-07-26-persistent-api-over-serverless.md.

x-money-env: &money-env
  NODE_ENV: production
  POLICYVAULT_DB: /data/policyvault.db
  # No default. The API refuses to boot in production without it, deliberately.
  ABI_KEY_PEPPER: ${ABI_KEY_PEPPER:?set ABI_KEY_PEPPER to 32+ random bytes}
  CHAIN: ${CHAIN:-base-sepolia}
  CHAIN_RPC_URL: ${CHAIN_RPC_URL:-}
  CDP_API_KEY_ID: ${CDP_API_KEY_ID:-}
  CDP_API_KEY_SECRET: ${CDP_API_KEY_SECRET:-}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  ABI_NOTIFY_EMAIL_TO: ${ABI_NOTIFY_EMAIL_TO:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  ABI_COMPLIANCE_DENYLIST: ${ABI_COMPLIANCE_DENYLIST:-}
  ABI_COMPLIANCE_WEBHOOK_URL: ${ABI_COMPLIANCE_WEBHOOK_URL:-}
  ABI_COMPLIANCE_FAIL_CLOSED: ${ABI_COMPLIANCE_FAIL_CLOSED:-1}
  # Outbound fetches to private addresses are an SSRF surface in production.
  ABI_ALLOW_LOCAL_TARGETS: ${ABI_ALLOW_LOCAL_TARGETS:-0}

services:
  api:
    build:
      context: .
      target: api
    ports:
      - "8787:8787"
    environment:
      <<: *money-env
      PORT: "8787"
      # The worker owns the sweeps.
      ABI_RUN_JOBS: "0"
      # Destructive / credential-minting routes stay closed unless opened.
      POLICYVAULT_ALLOW_BOOTSTRAP: ${POLICYVAULT_ALLOW_BOOTSTRAP:-0}
      POLICYVAULT_ALLOW_PUBLIC_ORG_CREATE: ${POLICYVAULT_ALLOW_PUBLIC_ORG_CREATE:-0}
      ABI_SIGNUP_TOKEN: ${ABI_SIGNUP_TOKEN:-}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-5000}
      APPROVAL_TTL_MINUTES: ${APPROVAL_TTL_MINUTES:-10}
    volumes:
      - abi_sqlite:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *money-env
    volumes:
      - abi_sqlite:/data
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      # Server-side proxy target. The console calls same-origin /abi-api.
      ABI_API_ORIGIN: ${ABI_API_ORIGIN:-http://api:8787}
      NEXT_PUBLIC_API_URL: /abi-api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # Staged for the Postgres migration (roadmap P2-T2). Not used yet: the API
  # still talks to SQLite. Start with `docker compose --profile postgres up`.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: abi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abi}
      POSTGRES_DB: policyvault
    ports:
      - "5432:5432"
    volumes:
      - abi_pg:/var/lib/postgresql/data

volumes:
  abi_sqlite:
  abi_pg:
