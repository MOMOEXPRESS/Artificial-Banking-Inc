[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

# ── RPCs (set in contracts/.env — never commit secrets) ─────────────────────
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

# ── Verification (Basescan / Etherscan v2 API key) ──────────────────────────
[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api", chain = 84532 }
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api", chain = 8453 }
